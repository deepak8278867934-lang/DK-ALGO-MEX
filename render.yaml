services:
  - type: web
    name: algo-bot-server
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_API_SECRET
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_API_SECRET
        sync: false
